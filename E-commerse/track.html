<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track your order | ShopEase</title>
    <meta name="description" content="Check the status of your order.">
    <meta name="theme-color" content="#0b0d1a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0d1a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='34' text-anchor='middle' fill='%23b13cff'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="track">
    <div id="site-header"></div>
    <div class="page-head"><div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span id="tr-crumb">Track your order</span></nav>
        <h1 id="tr-crumb-h">Track your order</h1><p>Enter your order number and the email or phone number you used at checkout.</p>
    </div></div>
    <main class="section" style="padding-top:36px"><div class="container" style="max-width:760px">
        <form class="card" id="track-form" style="display:grid;gap:16px">
            <div class="form-grid">
                <div class="field"><label for="t-id">Order number</label><input class="input" id="t-id" placeholder="SE-240101-AB12" required></div>
                <div class="field"><label for="t-contact">Email or phone</label><input class="input" id="t-contact" required></div>
            </div>
            <div class="alert alert-error" id="track-error" hidden></div>
            <button class="btn btn-primary" id="track-btn" type="submit" style="justify-self:start">Track order</button>
        </form>
        <div id="track-result" style="margin-top:24px"></div>
    </div></main>
    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/core.js"></script>
    <script src="js/track.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
