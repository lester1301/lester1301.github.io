<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist | ShopEase</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

   <!-- Main CSS -->
<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="logo"
            >
                ShopEase
            </a>


            <nav class="nav-menu">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="wishlist.html" class="active">
                    Wishlist
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </nav>


            <button
                class="menu-btn"
                type="button"
            >
                ☰
            </button>

        </div>

    </header>



    <!-- =========================
         WISHLIST
    ========================= -->

    <main>

        <section class="wishlist-section">

            <div class="container">


                <!-- Heading -->

                <div class="wishlist-heading">

                    <div>

                        <p class="section-label">
                            YOUR FAVOURITES
                        </p>

                        <h1>
                            My Wishlist ❤️
                        </h1>

                    </div>


                    <p
                        id="wishlist-count"
                        class="wishlist-count-text"
                    >
                        0 items
                    </p>

                </div>



                <!-- Wishlist Products -->

                <div
                    id="wishlist-container"
                    class="products-grid"
                ></div>



                <!-- Empty Wishlist -->

                <div
                    id="empty-wishlist"
                    class="empty-wishlist"
                    style="display: none;"
                >

                    <div class="empty-wishlist-icon">
                        ♡
                    </div>

                    <h2>
                        Your Wishlist is Empty
                    </h2>

                    <p>
                        Save your favourite products
                        and find them here.
                    </p>

                    <a
                        href="products.html"
                        class="add-cart-btn"
                    >
                        Continue Shopping
                    </a>

                </div>

            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 ShopEase. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="js/products.js"></script>

    <script src="js/wishlist.js"></script>

    <script src="js/wishlist-page.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
