<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | ShopEase</title>
    <meta name="description" content="Set a new password for your account.">
    <meta name="theme-color" content="#0b0d1a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Reset password | ShopEase">
    <meta property="og:description" content="Set a new password for your account.">
    <meta property="og:image" content="https://lester1301.github.io/E-commerse/images/banners/hero-1.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0d1a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='34' text-anchor='middle' fill='%23b13cff'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset">
    <div id="site-header"></div>
    <main class="auth-wrap">
        <div class="auth-art"><div><h2>Almost there.</h2><p>Choose a new password to get back into your account.</p></div></div>
        <div class="auth-form"><div class="auth-box">
            <h1>Set a new password</h1>
            <div class="alert alert-error" id="reset-error" hidden></div>
            <form id="reset-form" style="display:grid;gap:16px">
                <div class="field"><label for="r-pass">New password</label><input class="input" id="r-pass" type="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></div>
                <div class="field"><label for="r-pass2">Confirm password</label><input class="input" id="r-pass2" type="password" minlength="8" autocomplete="new-password" required></div>
                <button class="btn btn-primary btn-lg btn-block" id="reset-btn" type="submit">Reset password</button>
            </form>
            <p class="muted" style="font-size:13px;text-align:center"><a class="link" href="login.html">← Back to sign in</a></p>
        </div></div>
    </main>
    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/core.js"></script>
    <script src="js/reset.js"></script>
</body>
</html>
