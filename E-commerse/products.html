<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop all products | ShopEase</title>
    <meta name="description" content="Browse fashion, shoes, electronics and accessories. Filter by category, price and rating.">
    <meta name="theme-color" content="#0b0d1a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0d1a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='34' text-anchor='middle' fill='%23b13cff'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>@media (max-width:900px){.filter-close{display:inline-grid !important}}</style>
</head>
<body data-page="products">
    <div id="site-header"></div>
    <div class="page-head"><div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span id="shop-crumb">All products</span></nav>
        <h1 id="shop-title">All products</h1>
    </div></div>
    <main class="section" style="padding-top:36px"><div class="container">
        <div class="shop-layout">
            <aside class="filters" aria-label="Filters">
                <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:18px">Filters</h3><button class="icon-btn filter-close" id="close-filters" type="button" style="color:var(--ink);display:none" aria-label="Close filters"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
                <div id="filters-body" style="display:grid;gap:26px"></div>
            </aside>
            <section>
                <div class="shop-bar">
                    <div style="display:flex;align-items:center;gap:14px"><button class="btn btn-outline btn-sm filter-toggle" id="open-filters" type="button">Filters</button><span class="count" id="count"></span></div>
                    <label class="sr-only" for="sort">Sort by</label>
                    <select class="select" id="sort">
                        <option value="featured">Featured</option><option value="new">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option>
                    </select>
                </div>
                <div class="chips" id="chips"></div>
                <div class="product-grid" id="shop-grid"></div>
                <div class="load-more" id="load-more" hidden><button class="btn btn-outline btn-lg" type="button">Show more products</button></div>
            </section>
        </div>
    </div></main>
    <div id="site-footer"></div>

    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/core.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
